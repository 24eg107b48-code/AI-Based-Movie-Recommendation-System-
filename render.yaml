services:
  # Frontend Static Site
  - type: web
    name: movie-recommendation-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://movie-recommendation-backend.onrender.com/api

  # Backend Web Service
  - type: web
    name: movie-recommendation-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: default
