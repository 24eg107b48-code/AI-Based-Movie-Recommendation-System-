# Server Configuration (Supports dynamic cloud PORT like Render, default 8080)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=movie-recommendation-backend

# DataSource Configuration:
# Defaults to embedded in-memory database with MySQL syntax compatibility.
# If an external MySQL database URL is provided (e.g. SPRING_DATASOURCE_URL), it connects to that instead!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:movie_rec_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Allow H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JSON formatting
spring.jackson.serialization.indent_output=true
