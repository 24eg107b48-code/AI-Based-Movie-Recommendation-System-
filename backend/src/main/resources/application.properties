# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=movie-recommendation-backend

# MySQL Database Configuration
# Default connects to local MySQL service (port 3306, database: movie_rec_db)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_rec_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 Console if running in H2 profile
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON formatting
spring.jackson.serialization.indent_output=true
